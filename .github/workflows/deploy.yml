name: 🚀 Deploy Laravel App via SFTP

on:
  push:
    branches:
      - backend_dev
      - backend_prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set deployment path
        run: |
          case "${GITHUB_REF_NAME}" in
            "backend_dev") echo "REMOTE_PATH=/home/eord0oj6j22n/dev.almysapp.com/alyms" >> $GITHUB_ENV ;;
            "backend_prod")        echo "REMOTE_PATH=/home/eord0oj6j22n/public_html/alyms" >> $GITHUB_ENV ;;
          esac

      - name: Clean unnecessary local files before upload
        run: |
          rm -rf .git
          rm -rf .github
          rm -rf node_modules
          rm -rf vendor
          rm -f .env
          rm -f .env.*
          rm -rf bootstrap/cache/*.php
          rm -rf storage/framework/cache/data/*
          rm -rf storage/*.key
          rm -rf public/storage
          rm -rf public/build
          rm -rf public/hot

      - name: Deploy files via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.ALYMS_HOST }}
          username: ${{ secrets.ALYMS_USERNAME }}
          password: ${{ secrets.ALYMS_PASSWORD }}
          port: 22
          local_path: ./
          remote_path: ${{ env.REMOTE_PATH }}
          sftp_only: true
          exclude: |
            .git*
            .github*
            node_modules/*
            vendor/*
            *.env
            storage/*.key
            storage/framework/cache/data/*
            bootstrap/cache/*.php
            public/storage/*
            public/hot
            public/build

      - name: Run Laravel commands on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALYMS_HOST }}
          username: ${{ secrets.ALYMS_USERNAME }}
          password: ${{ secrets.ALYMS_PASSWORD }}
          port: 22
          use_insecure_cipher: true
          script: |
            cd ${{ env.REMOTE_PATH }}

            # Remove old cached files (fixes 405 error)
            rm -f bootstrap/cache/*.php

            # Rebuild vendor
            /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader

            # Migrations
            php artisan migrate --force

            # Create storage link
            php artisan storage:link || true

            # Clear cache fully
            php artisan optimize:clear
